<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端心電感應 - 多人默契大考驗 (W5)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #FDEEEF 0%, #F4E3E3 40%, #E8D3DD 70%, #E2C2C6 100%);
            min-height: 100vh;
            color: #5A4A56;
            font-family: "Noto Sans TC", sans-serif;
            overflow-x: hidden;
            margin: 0;
        }
        .font-rounded { font-family: "Comfortaa", cursive; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 36px 0 rgba(184, 140, 153, 0.15);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 24px -4px rgba(160, 120, 135, 0.12);
        }
        .perspective-1000 { perspective: 1000px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="relative flex flex-col justify-between min-h-screen">

    <!-- Header -->
    <header class="relative z-20 w-full px-4 py-3 flex justify-between items-center max-w-6xl mx-auto">
        <div class="flex items-center space-x-2">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                <i class="fa-solid fa-lock-open mr-1.5 text-emerald-600"></i> W5 打開
            </span>
            <span id="room-code-badge" class="hidden inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-white/80 text-[#6C5B68] border border-white">
                <i class="fa-solid fa-house-signal mr-1.5 text-[#E08E9D]"></i>
                房號: <span id="display-room-code" class="ml-1 font-bold">---</span>
            </span>
        </div>

        <h1 class="font-rounded font-bold text-xl md:text-2xl text-[#6C5B68] tracking-wide flex items-center">
            <i class="fa-solid fa-cloud text-[#E08E9D] mr-2"></i> 雲端心電感應
        </h1>

        <button id="header-host-btn" class="p-2 text-[#6C5B68] hover:text-[#E08E9D] rounded-full bg-white/70 hover:bg-white shadow-sm transition" title="房主控制台">
            <i class="fa-solid fa-user-gear text-lg"></i>
        </button>
    </header>

    <!-- Main Container -->
    <main class="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 py-4 flex flex-col justify-center items-center">

        <!-- VIEW 1: LOGIN -->
        <div id="login-view" class="w-full max-w-md glass-panel rounded-3xl p-6 md:p-8 my-auto">
            <div class="text-center mb-6">
                <div class="inline-block p-4 rounded-full bg-[#F4E3E3] mb-3">
                    <i class="fa-solid fa-heart-pulse text-3xl text-[#E08E9D]"></i>
                </div>
                <h2 class="text-xl font-bold text-[#6C5B68]">加入心電感應房間</h2>
                <p class="text-xs text-[#6C5B68]/70 mt-1">輸入暱稱與房號，測試你們的默契！</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-[#6C5B68]/80 mb-1 ml-1">玩家暱稱</label>
                    <input type="text" id="player-name-input" placeholder="請輸入您的名稱" 
                        class="w-full px-4 py-2.5 bg-white/80 border border-[#D3B1C2]/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#E08E9D] text-[#6C5B68] text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-medium text-[#6C5B68]/80 mb-1 ml-1">房間代碼</label>
                    <input type="text" id="room-code-input" value="W5" placeholder="例如: W5" 
                        class="w-full px-4 py-2.5 bg-white/80 border border-[#D3B1C2]/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#E08E9D] text-[#6C5B68] text-sm font-medium uppercase">
                </div>

                <div class="pt-2 grid grid-cols-2 gap-3">
                    <button id="btn-join-player" type="button" class="w-full py-3 px-4 bg-gradient-to-r from-[#E08E9D] to-[#D3B1C2] text-white rounded-xl font-semibold shadow-md hover:opacity-95 active:scale-95 transition text-sm">
                        <i class="fa-solid fa-right-to-bracket mr-1.5"></i> 以玩家加入
                    </button>
                    <button id="btn-join-host" type="button" class="w-full py-3 px-4 bg-white text-[#6C5B68] border border-[#E8C5C8] rounded-xl font-semibold hover:bg-[#F4E3E3] active:scale-95 transition text-sm">
                        <i class="fa-solid fa-crown mr-1.5 text-yellow-500"></i> 我是房主
                    </button>
                </div>

                <button id="btn-quick-w5" type="button" class="w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-sm active:scale-95 transition text-xs">
                    <i class="fa-solid fa-bolt mr-1.5"></i> 一鍵快速進入 W5 房間
                </button>
            </div>
        </div>

        <!-- VIEW 2: GAMEPLAY -->
        <div id="game-view" class="hidden w-full space-y-6">
            <!-- Top Bar -->
            <div class="glass-panel rounded-2xl p-4 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-[#F4E3E3] flex items-center justify-center border border-white">
                        <i id="user-role-icon" class="fa-solid fa-crown text-yellow-500"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="current-player-display" class="font-bold text-[#6C5B68] text-base">---</span>
                            <span id="role-badge" class="px-2 py-0.5 text-xs rounded-md bg-yellow-200 text-yellow-800 font-bold">房主</span>
                        </div>
                        <p class="text-xs text-[#6C5B68]/60">房號: <span id="current-room-display" class="font-semibold">W5</span></p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button id="btn-open-drawer" type="button" class="px-3.5 py-2 text-xs bg-[#E08E9D] hover:opacity-90 text-white font-bold rounded-xl shadow-sm">
                        <i class="fa-solid fa-pen-to-square mr-1.5"></i> 房主出題 / 開牌
                    </button>
                    <button id="btn-leave-room" type="button" class="px-3 py-2 text-xs bg-white/80 hover:bg-white text-[#6C5B68] rounded-xl border border-[#D3B1C2]/40">
                        <i class="fa-solid fa-door-open mr-1"></i> 離開
                    </button>
                </div>
            </div>

            <!-- STATE 1: SETUP (Cho phép nhập câu hỏi trực tiếp ngay tại đây!) -->
            <div id="state-setup" class="glass-panel rounded-3xl p-6 md:p-8 text-center max-w-xl mx-auto space-y-4">
                <div class="inline-block text-4xl text-[#E08E9D]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h3 class="text-xl font-bold text-[#6C5B68]">請設定本輪默契題目</h3>
                <p class="text-xs text-[#6C5B68]/70">輸入題目後按下發布，題目就會立刻顯示在畫面上讓大家填答！</p>
                
                <div class="pt-2 space-y-3 text-left">
                    <input type="text" id="inline-question-input" placeholder="例如：說到夏天第一個想到的水果？" 
                        class="w-full px-4 py-3 bg-white/90 border border-[#D3B1C2]/50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#E08E9D] text-[#6C5B68]">
                    <button id="btn-inline-set-question" type="button" class="w-full py-3 bg-gradient-to-r from-[#E08E9D] to-[#D3B1C2] text-white text-sm font-bold rounded-xl shadow-md hover:opacity-95 active:scale-95 transition">
                        <i class="fa-solid fa-play mr-2"></i> 發布題目並開始填答
                    </button>
                </div>
            </div>

            <!-- STATE 2: PLAYING (Hiển thị câu hỏi & ô nhập đáp án) -->
            <div id="state-playing" class="hidden space-y-6">
                <div class="glass-panel rounded-3xl p-6 md:p-8 text-center border-2 border-[#E8C5C8] relative overflow-hidden">
                    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#E8C5C8] via-[#E08E9D] to-[#D3B1C2]"></div>
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-[#E8C5C8]/40 text-[#6C5B68] mb-3">
                        <i class="fa-solid fa-lightbulb mr-1 text-[#E08E9D]"></i> 本輪默契題目
                    </span>
                    <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-[#6C5B68] leading-relaxed">---</h2>
                </div>

                <div class="glass-panel rounded-3xl p-6 max-w-md mx-auto space-y-4">
                    <h4 class="text-sm font-bold text-[#6C5B68] text-center">
                        <i class="fa-solid fa-pen-nib text-[#E08E9D] mr-1.5"></i> 輸入您的默契答案
                    </h4>
                    <input type="text" id="answer-input" placeholder="請寫下您的回答..." 
                        class="w-full px-4 py-3 bg-white/90 border border-[#D3B1C2]/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#E08E9D] text-[#6C5B68] font-medium text-center">
                    <button id="submit-answer-btn" type="button" class="w-full py-3 bg-gradient-to-r from-[#E08E9D] to-[#D3B1C2] text-white font-bold rounded-xl shadow-md hover:opacity-95 active:scale-95 transition">
                        <i class="fa-solid fa-paper-plane mr-2"></i> 送出答案
                    </button>
                    <div class="text-center text-xs text-[#6C5B68]/70 flex items-center justify-between pt-2 border-t border-[#D3B1C2]/30">
                        <span id="answered-count-text">目前提交人數: 0 人</span>
                        <button id="btn-quick-reveal" type="button" class="text-[#E08E9D] font-bold hover:underline">
                            立即翻牌開獎 &rarr;
                        </button>
                    </div>
                </div>
            </div>

            <!-- STATE 3: REVEALED (Lật thẻ 3D công bố đáp án) -->
            <div id="state-revealed" class="hidden space-y-6">
                <div class="text-center space-y-2">
                    <span class="inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-[#E08E9D] text-white shadow-sm">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 答案大公開 (點擊卡片可翻轉)
                    </span>
                    <h3 id="revealed-question-title" class="text-xl font-bold text-[#6C5B68]">題目：---</h3>
                </div>

                <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 p-2"></div>

                <div class="text-center pt-4">
                    <button id="btn-next-round" type="button" class="px-6 py-2.5 bg-white text-[#6C5B68] font-bold text-xs rounded-xl shadow border border-[#D3B1C2]/50 hover:bg-[#F4E3E3] transition">
                        <i class="fa-solid fa-rotate-right mr-1.5 text-[#E08E9D]"></i> 進行下一題
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- HOST DRAWER -->
    <div id="host-drawer" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex justify-end transition-opacity duration-300 opacity-0 pointer-events-none">
        <div id="host-drawer-content" class="w-full max-w-md bg-[#FAF6F6] h-full shadow-2xl p-6 flex flex-col justify-between transform translate-x-full transition-transform duration-300 overflow-y-auto">
            <div>
                <div class="flex justify-between items-center pb-4 border-b border-[#D3B1C2]/30">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg bg-[#E08E9D] text-white flex items-center justify-center">
                            <i class="fa-solid fa-crown text-sm"></i>
                        </div>
                        <h3 class="font-bold text-lg text-[#6C5B68]">房主控制台</h3>
                    </div>
                    <button id="btn-close-drawer" type="button" class="p-2 text-[#6C5B68]/60 hover:text-[#6C5B68] rounded-full">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="mt-6 space-y-5">
                    <div class="glass-panel p-4 rounded-2xl space-y-3">
                        <label class="block text-xs font-bold text-[#6C5B68]">
                            <i class="fa-solid fa-bullhorn text-[#E08E9D] mr-1"></i> 設定新題目
                        </label>
                        <textarea id="host-question-input" rows="3" placeholder="輸入題目內容..." 
                            class="w-full p-3 bg-white border border-[#D3B1C2]/50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#E08E9D] text-[#6C5B68]"></textarea>
                        <button id="btn-drawer-set-question" type="button" class="w-full py-2.5 bg-[#E08E9D] text-white text-sm font-bold rounded-xl shadow hover:opacity-90 transition">
                            <i class="fa-solid fa-play mr-2"></i> 發布題目並開始填答
                        </button>
                    </div>

                    <div class="glass-panel p-4 rounded-2xl space-y-2">
                        <h4 class="text-xs font-bold text-[#6C5B68] flex justify-between items-center">
                            <span><i class="fa-solid fa-users text-[#E08E9D] mr-1"></i> 已填答玩家清單</span>
                            <span id="host-answered-ratio" class="text-[#E08E9D] font-bold">0 人</span>
                        </h4>
                        <div id="host-players-list" class="space-y-1.5 max-h-40 overflow-y-auto pt-1 text-xs text-[#6C5B68]">
                            <p class="text-[#6C5B68]/50 text-center py-2">尚無提交紀錄...</p>
                        </div>
                    </div>

                    <div class="glass-panel p-4 rounded-2xl space-y-3">
                        <button id="btn-drawer-reveal" type="button" class="w-full py-3 bg-gradient-to-r from-purple-500 to-[#E08E9D] text-white text-sm font-bold rounded-xl shadow-md hover:opacity-95 transition">
                            <i class="fa-solid fa-layer-group mr-2"></i> 同步 3D 翻牌開獎！
                        </button>
                        <button id="btn-drawer-reset" type="button" class="w-full py-2 bg-red-400/80 hover:bg-red-500 text-white text-xs font-bold rounded-xl transition">
                            重置房間至出題階段
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <footer class="relative z-10 py-3 text-center text-xs text-[#6C5B68]/50">
        雲端心電感應 &copy; Pink Morandi Edition (W5)
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentRoom = "";
            let playerName = "";
            let userRole = "player";
            let isFlippedState = false;

            const STORAGE_PREFIX = "telepathy_w5_room_";

            function getRoomState(room) {
                try {
                    const raw = localStorage.getItem(STORAGE_PREFIX + room);
                    return raw ? JSON.parse(raw) : { status: "setup", question: "", answers: {} };
                } catch (e) {
                    return { status: "setup", question: "", answers: {} };
                }
            }

            function saveRoomState(room, state) {
                localStorage.setItem(STORAGE_PREFIX + room, JSON.stringify(state));
                renderGameState(state);
            }

            // Lắng nghe thay đổi nếu mở nhiều tab trên cùng trình duyệt
            window.addEventListener('storage', (e) => {
                if (currentRoom && e.key === STORAGE_PREFIX + currentRoom && e.newValue) {
                    renderGameState(JSON.parse(e.newValue));
                }
            });

            function joinRoom(role) {
                const nameInput = document.getElementById('player-name-input').value.trim();
                let roomInput = document.getElementById('room-code-input').value.trim().toUpperCase();

                if (!nameInput) {
                    showToast("請先輸入玩家暱稱！", "warning");
                    document.getElementById('player-name-input').focus();
                    return;
                }
                if (!roomInput) roomInput = "W5";

                playerName = nameInput;
                currentRoom = roomInput;
                userRole = role;

                document.getElementById('current-player-display').textContent = playerName;
                document.getElementById('current-room-display').textContent = currentRoom;
                document.getElementById('display-room-code').textContent = currentRoom;
                document.getElementById('room-code-badge').classList.remove('hidden');

                const roleBadge = document.getElementById('role-badge');
                const roleIcon = document.getElementById('user-role-icon');
                if (role === 'host') {
                    roleBadge.textContent = "房主";
                    roleBadge.className = "px-2 py-0.5 text-xs rounded-md bg-yellow-200 text-yellow-800 font-bold";
                    roleIcon.className = "fa-solid fa-crown text-yellow-500";
                } else {
                    roleBadge.textContent = "玩家";
                    roleBadge.className = "px-2 py-0.5 text-xs rounded-md bg-[#E8C5C8]/50 text-[#6C5B68] font-bold";
                    roleIcon.className = "fa-solid fa-user text-[#E08E9D]";
                }

                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('game-view').classList.remove('hidden');

                renderGameState(getRoomState(currentRoom));
                showToast(`已進入房間 [${currentRoom}]`, "success");
            }

            function publishQuestion(questionText) {
                const q = questionText.trim();
                if (!q) {
                    showToast("請輸入題目內容！", "warning");
                    return;
                }
                const newState = {
                    status: "playing",
                    question: q,
                    answers: {}
                };
                isFlippedState = false;
                saveRoomState(currentRoom, newState);
                showToast("題目已發布！", "success");
            }

            function submitAnswer() {
                const ansInput = document.getElementById('answer-input');
                const ans = ansInput.value.trim();
                if (!ans) {
                    showToast("請輸入您的答案！", "warning");
                    ansInput.focus();
                    return;
                }
                const state = getRoomState(currentRoom);
                state.answers[playerName] = ans;
                saveRoomState(currentRoom, state);
                showToast("答案已送出！", "success");
            }

            function revealAnswers() {
                const state = getRoomState(currentRoom);
                state.status = "revealed";
                saveRoomState(currentRoom, state);
            }

            function resetGame() {
                const newState = { status: "setup", question: "", answers: {} };
                isFlippedState = false;
                document.getElementById('answer-input').value = "";
                document.getElementById('inline-question-input').value = "";
                document.getElementById('host-question-input').value = "";
                saveRoomState(currentRoom, newState);
                showToast("已重置，請輸入新題目", "info");
            }

            function toggleDrawer(forceClose = false) {
                if (!currentRoom) {
                    showToast("請先加入房間！", "warning");
                    return;
                }
                const drawer = document.getElementById('host-drawer');
                const content = document.getElementById('host-drawer-content');
                const isOpen = !drawer.classList.contains('pointer-events-none');

                if (isOpen || forceClose) {
                    drawer.classList.add('opacity-0', 'pointer-events-none');
                    content.classList.add('translate-x-full');
                } else {
                    drawer.classList.remove('opacity-0', 'pointer-events-none');
                    content.classList.remove('translate-x-full');
                }
            }

            function renderGameState(state) {
                const status = state.status || "setup";
                const question = state.question || "";
                const answers = state.answers || {};

                // Cập nhật danh sách người đã trả lời trong Drawer
                const entries = Object.entries(answers);
                document.getElementById('host-answered-ratio').textContent = `${entries.length} 人已提交`;
                const listEl = document.getElementById('host-players-list');
                listEl.innerHTML = entries.length === 0
                    ? `<p class="text-[#6C5B68]/50 text-center py-2">尚無提交紀錄...</p>`
                    : entries.map(([name]) => `
                        <div class="flex items-center justify-between bg-white px-3 py-1.5 rounded-lg border border-white">
                            <span class="font-medium text-[#6C5B68]">${escapeHtml(name)}</span>
                            <span class="text-emerald-600 text-xs font-bold"><i class="fa-solid fa-check mr-1"></i>已填答</span>
                        </div>
                    `).join('');

                // Chuyển đổi 3 màn hình trạng thái
                const setupView = document.getElementById('state-setup');
                const playingView = document.getElementById('state-playing');
                const revealedView = document.getElementById('state-revealed');

                setupView.classList.add('hidden');
                playingView.classList.add('hidden');
                revealedView.classList.add('hidden');

                if (status === "playing" && question) {
                    playingView.classList.remove('hidden');
                    document.getElementById('question-text').textContent = question;
                    document.getElementById('answered-count-text').textContent = `目前提交人數: ${entries.length} 人`;
                } else if (status === "revealed") {
                    revealedView.classList.remove('hidden');
                    document.getElementById('revealed-question-title').textContent = `題目：${question}`;
                    renderCards(entries);
                } else {
                    setupView.classList.remove('hidden');
                }
            }

            function renderCards(entries) {
                const grid = document.getElementById('cards-grid');
                if (entries.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-sm text-[#6C5B68]/60 py-8">尚無玩家提交答案！</p>`;
                    return;
                }
                grid.innerHTML = entries.map(([name, ans]) => `
                    <div class="perspective-1000 h-44 cursor-pointer" onclick="this.querySelector('.card-inner').classList.toggle('is-flipped')">
                        <div class="card-inner ${isFlippedState ? 'is-flipped' : ''}">
                            <div class="card-front glass-card flex flex-col items-center justify-center p-4 text-center">
                                <div class="w-12 h-12 rounded-full bg-[#F4E3E3] flex items-center justify-center mb-2 text-[#E08E9D] text-xl">
                                    <i class="fa-solid fa-cloud"></i>
                                </div>
                                <p class="font-bold text-[#6C5B68]">${escapeHtml(name)}</p>
                                <span class="text-xs text-[#6C5B68]/50 mt-1">點擊翻牌</span>
                            </div>
                            <div class="card-back bg-gradient-to-br from-[#E08E9D] to-[#D3B1C2] text-white flex flex-col items-center justify-center p-4 text-center shadow-lg">
                                <span class="text-xs opacity-80 mb-1">${escapeHtml(name)} 的答案</span>
                                <p class="text-xl font-bold break-words w-full">${escapeHtml(ans)}</p>
                            </div>
                        </div>
                    </div>
                `).join('');

                if (!isFlippedState) {
                    setTimeout(() => {
                        isFlippedState = true;
                        document.querySelectorAll('.card-inner').forEach(el => el.classList.add('is-flipped'));
                    }, 350);
                }
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function showToast(msg, type = "info") {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const bg = type === "success" ? "bg-emerald-500" : type === "warning" ? "bg-amber-500" : "bg-[#6C5B68]";
                toast.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold transition-all duration-300`;
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            // Gắn sự kiện cho tất cả các nút
            document.getElementById('btn-join-player').addEventListener('click', () => joinRoom('player'));
            document.getElementById('btn-join-host').addEventListener('click', () => joinRoom('host'));
            document.getElementById('btn-quick-w5').addEventListener('click', () => {
                const nameEl = document.getElementById('player-name-input');
                if (!nameEl.value.trim()) nameEl.value = "房主_W5";
                document.getElementById('room-code-input').value = "W5";
                joinRoom('host');
            });

            document.getElementById('btn-inline-set-question').addEventListener('click', () => {
                publishQuestion(document.getElementById('inline-question-input').value);
            });

            document.getElementById('btn-drawer-set-question').addEventListener('click', () => {
                const val = document.getElementById('host-question-input').value;
                if (val.trim()) {
                    publishQuestion(val);
                    document.getElementById('host-question-input').value = "";
                    toggleDrawer(true);
                } else {
                    showToast("請輸入題目內容！", "warning");
                }
            });

            document.getElementById('submit-answer-btn').addEventListener('click', submitAnswer);
            document.getElementById('btn-quick-reveal').addEventListener('click', revealAnswers);
            document.getElementById('btn-drawer-reveal').addEventListener('click', () => {
                revealAnswers();
                toggleDrawer(true);
            });
            document.getElementById('btn-drawer-reset').addEventListener('click', () => {
                resetGame();
                toggleDrawer(true);
            });
            document.getElementById('btn-next-round').addEventListener('click', resetGame);

            document.getElementById('header-host-btn').addEventListener('click', () => toggleDrawer());
            document.getElementById('btn-open-drawer').addEventListener('click', () => toggleDrawer());
            document.getElementById('btn-close-drawer').addEventListener('click', () => toggleDrawer(true));
            document.getElementById('btn-leave-room').addEventListener('click', () => {
                currentRoom = "";
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('room-code-badge').classList.add('hidden');
            });
        });
    </script>
</body>
</html>
