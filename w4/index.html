<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 - 哆啦A夢特別版</title>
  
  <!-- 載入 Google Fonts 圓潤可愛字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【控制區域 1：視覺主題顏色設定 (CSS Variables)】
       你可以修改這裡的 HEX 碼來調整網頁整體配色
       ========================================================================== */
    :root {
      --dora-blue: #0096e6;        /* 主色：哆啦藍 */
      --dora-blue-dark: #006eb8;   /* 輔助色：深哆啦藍 */
      --dora-red: #e60012;         /* 亮點色：項圈/鼻子紅 */
      --dora-yellow: #ffde00;      /* 聚焦/發光色：鈴鐺黃 */
      --dora-white: #ffffff;       /* 卡片背景色：口袋白 */
      --dora-dark: #2c3e50;        /* 文字與外框色：濃黑 */
      --bg-dots: #7ecaff;          /* 背景圓點裝飾色 */
    }

    /* ==========================================================================
       全域基礎樣式
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: var(--dora-blue);
      /* 經典可愛的水玉圓點背景 */
      background-image: radial-gradient(var(--bg-dots) 20%, transparent 20%),
                        radial-gradient(var(--bg-dots) 20%, transparent 20%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: var(--dora-dark);
      padding: 30px 15px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頁首 Header 區塊 */
    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .title-box {
      display: inline-block;
      background-color: var(--dora-red);
      color: var(--dora-white);
      padding: 12px 35px;
      border-radius: 50px;
      border: 4px solid var(--dora-dark);
      box-shadow: 0px 6px 0px var(--dora-dark);
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px var(--dora-dark);
    }

    /* 標題下方的鈴鐺小裝飾 */
    .title-box::after {
      content: '🔔';
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      background: var(--dora-yellow);
      width: 42px;
      height: 42px;
      line-height: 38px;
      border-radius: 50%;
      border: 3px solid var(--dora-dark);
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .subtitle {
      margin-top: 25px;
      color: var(--dora-white);
      font-size: 1.1rem;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    }

    /* ==========================================================================
       【需求：酷炫載入中動畫】竹蜻蜓旋轉效果
       ========================================================================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
    }

    .bamboo-copter {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }

    /* 螺旋槳 */
    .blade {
      position: absolute;
      top: 15px;
      left: 5px;
      width: 70px;
      height: 12px;
      background-color: var(--dora-yellow);
      border: 3px solid var(--dora-dark);
      border-radius: 10px;
      animation: spinBlade 0.4s linear infinite;
    }

    /* 支架 */
    .stem {
      position: absolute;
      top: 24px;
      left: 36px;
      width: 8px;
      height: 35px;
      background-color: var(--dora-yellow);
      border: 3px solid var(--dora-dark);
    }

    @keyframes spinBlade {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    .loading-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--dora-white);
      background: var(--dora-dark);
      padding: 8px 24px;
      border-radius: 20px;
      letter-spacing: 2px;
      animation: pulseText 1.2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.95); opacity: 0.7; }
    }

    /* ==========================================================================
       【需求：瀑布流排版 (Masonry Layout)】
       ========================================================================== */
    .masonry-wall {
      max-width: 1200px;
      margin: 0 auto;
      /* 使用 CSS column-count 製作錯落排列 */
      column-count: 3;
      column-gap: 20px;
    }

    /* 響應式欄數調整 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; }
    }

    /* ==========================================================================
       留言卡片基礎樣式
       ========================================================================== */
    .message-card {
      background-color: var(--dora-white);
      border: 4px solid var(--dora-dark);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      /* 防止卡片在瀑布流中被拆斷到下一欄 */
      break-inside: avoid;
      box-shadow: 6px 6px 0px var(--dora-dark);
      position: relative;
      
      /* 平滑漸變過渡設定 (控制 Highlight 動畫的順暢度) */
      transition: transform 0.5s ease, 
                  opacity 0.5s ease, 
                  filter 0.5s ease, 
                  box-shadow 0.5s ease, 
                  border-color 0.5s ease;
      
      /* 預設非焦點狀態：稍微降低亮度 */
      opacity: 0.85;
      filter: grayscale(10%);
    }

    /* 卡片頭部（暱稱與頭像） */
    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px dashed #e0e0e0;
      padding-bottom: 8px;
    }

    .avatar-icon {
      width: 36px;
      height: 36px;
      background-color: var(--dora-yellow);
      border: 2px solid var(--dora-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--dora-dark);
      word-break: break-all;
    }

    /* 卡片留言內文 */
    .card-content {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #333333;
      white-space: pre-wrap; /* 保持原留言的換行 */
      word-break: break-word;
    }

    .card-time {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #888888;
      text-align: right;
    }

    /* ==========================================================================
       【需求：隨時間輪播特效 (Highlight 效果)】
       由 JavaScript 動態切換亮起與變暗狀態
       ========================================================================== */

    /* 1. 當前選中的卡片：放大亮起、外框變紅、發出黃光 */
    .message-card.highlight {
      opacity: 1 !important;
      filter: grayscale(0%) blur(0px) !important;
      transform: scale(1.08) translateY(-6px);
      border-color: var(--dora-red) !important;
      box-shadow: 0 0 25px var(--dora-yellow), 10px 10px 0px var(--dora-dark);
      z-index: 10;
    }

    /* 2. 其他未選中的卡片：變暗、微模糊 */
    .has-active-highlight .message-card:not(.highlight) {
      opacity: 0.35;
      filter: blur(1.5px) grayscale(40%);
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- 標題區域 -->
  <header>
    <div class="title-box">
      <h1>朋友對我的動態留言板</h1>
    </div>
    <div class="subtitle">來自四次元口袋的祝福訊息 ✨</div>
  </header>

  <!-- 載入中酷炫動畫 -->
  <div id="loading-container">
    <div class="bamboo-copter">
      <div class="blade"></div>
      <div class="stem"></div>
    </div>
    <div class="loading-text">讀取留言中⋯⋯</div>
  </div>

  <!-- 瀑布流留言牆容器 -->
  <main class="masonry-wall" id="wall-container"></main>

  <script>
    /* ==========================================================================
       【控制區域 2：JavaScript 參數與設定】
       ========================================================================== */
    
    // Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSZhCslPmY2QTDwhW7kR3BNAf4gL4WjoNaLf9UpJsb4_ajX218xUgl2fXJf3KeHjxEmhGqjfN7Pi2n/pub?output=csv';

    // 【輪播秒數設定】每隔多少毫秒切換下一張卡片（3000ms = 3 秒）
    const CAROUSEL_SPEED = 3000;

    // 隨機頭像圖示選單（哆啦A夢經典元素）
    const AVATAR_ICONS = ['🔔', '🚪', '🚁', '🤖', '🌟', '🍩', '🎈', '✨'];

    // 全域變數
    let messageList = [];      // 儲存解析後的留言陣列
    let currentFocusIndex = 0; // 目前焦點卡片的索引
    let carouselTimer = null;  // 定時器物件

    /* ==========================================================================
       1. CSV 解析邏輯（妥善處理包含逗號與換行字元的留言內容）
       ========================================================================== */
    function parseCSVData(rawCSV) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < rawCSV.length; i++) {
        const char = rawCSV[i];
        const nextChar = rawCSV[i + 1];

        if (char === '"') {
          // 處理雙引號轉義
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++; // 跳過 \r\n 中的 \n
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell.length > 0)) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }
      
      if (currentCell.length > 0 || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }

      // 跳過表頭 (第一橫列)，對應欄位：[0]時間戳記, [1]名字, [2]留言
      return rows.slice(1).map(row => ({
        timestamp: row[0] || '',
        name: row[1] || '匿名朋友',
        content: row[2] || (row[1] ? row[1] : '（沒有填寫留言）')
      }));
    }

    /* ==========================================================================
       2. 動態生成留言卡片 (渲染 DOM)
       ========================================================================== */
    function createCardsUI(data) {
      const container = document.getElementById('wall-container');
      container.innerHTML = ''; // 清空容器

      data.forEach((item, index) => {
        // 隨機選一個頭像圖表
        const randomIcon = AVATAR_ICONS[Math.floor(Math.random() * AVATAR_ICONS.length)];

        // 建立 Card HTML 元素
        const cardNode = document.createElement('div');
        cardNode.className = 'message-card';
        cardNode.setAttribute('data-card-id', index);

        cardNode.innerHTML = `
          <div class="card-header">
            <div class="avatar-icon">${randomIcon}</div>
            <div class="user-name">${sanitizeHTML(item.name)}</div>
          </div>
          <div class="card-content">${sanitizeHTML(item.content)}</div>
          ${item.timestamp ? `<div class="card-time">\${sanitizeHTML(item.timestamp)}</div>` : ''}
        `;

        container.appendChild(cardNode);
      });
    }

    // HTML 轉義，預防 XSS 攻擊
    function sanitizeHTML(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[match]));
    }

    /* ==========================================================================
       3. 隨時間輪播特效 (setInterval 控制 Highlight)
       ========================================================================== */
    function startHighlightsCarousel() {
      const cards = document.querySelectorAll('.message-card');
      const container = document.getElementById('wall-container');

      if (cards.length === 0) return;

      // 啟用全域 Highlight 模式狀態
      container.classList.add('has-active-highlight');

      // 立即執行第一次 highlight
      triggerCardHighlight(cards, currentFocusIndex);

      // 設定每隔 CAROUSEL_SPEED (3秒) 自動輪播
      carouselTimer = setInterval(() => {
        // 索引值順序加 1，到底後循環回到 0
        currentFocusIndex = (currentFocusIndex + 1) % cards.length;
        triggerCardHighlight(cards, currentFocusIndex);
      }, CAROUSEL_SPEED);
    }

    // 單張卡片亮起處理
    function triggerCardHighlight(cards, focusIndex) {
      cards.forEach((card, idx) => {
        if (idx === focusIndex) {
          card.classList.add('highlight');
          
          // 自動平滑捲動，確保當前 Highlight 卡片處於可見視窗中
          card.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest'
          });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    /* ==========================================================================
       4. 主程式初始化：使用 fetch 取得 CSV 資料
       ========================================================================== */
    async function initBoard() {
      const loadingBox = document.getElementById('loading-container');

      try {
        // 使用 fetch 取得試算表 CSV 資料
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('資料讀取失敗');

        const csvRawText = await response.text();

        // 解析 CSV 資料
        messageList = parseCSVData(csvRawText);

        // 隱藏載入中動畫
        loadingBox.style.display = 'none';

        if (messageList.length === 0) {
          document.getElementById('wall-container').innerHTML = 
            '<div style="text-align:center; color:white; width:100%;">目前還沒有任何留言喔！</div>';
          return;
        }

        // 1. 動態生成卡片
        createCardsUI(messageList);

        // 2. 啟動 3 秒輪播亮起特效
        startHighlightsCarousel();

      } catch (err) {
        console.error('初始化留言板錯誤:', err);
        loadingBox.innerHTML = `
          <div class="loading-text" style="background: var(--dora-red);">
            ❌ 載入失敗，請檢查網址或試算表發布設定。
          </div>
        `;
      }
    }

    // 頁面加載完成後觸發
    window.addEventListener('DOMContentLoaded', initBoard);
  </script>
</body>
</html>
